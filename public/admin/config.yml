backend:
  name: github
  auth_methods: [token]
  # Troque pelo owner/repositório real, exemplo:
  repo: "usuario-ou-org/nome-do-repositorio"
  # Troque pela branch usada para publicar o site, exemplo:
  branch: "main"

# URL local de desenvolvimento. Troque pela URL pública do site antes do deploy, exemplo
site_url: "http://seu-dominio.com"

# Título do CMS no login e na aba do navegador após o carregamento.
app_title: "Painel Admin"

logo:
  src: /favicon.png
  show_in_header: true

media_folder: /src/assets/blog
public_folder: /src/assets/blog

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} - {{pubDate}}"
    fields:
      - label: Status
        name: status
        widget: select
        default: Publicado
        options:
          - Publicado
          - Rascunho

      - label: Titulo
        name: title
        widget: string
        required: true

      - label: Data de Publicacao
        name: pubDate
        widget: datetime
        required: true
        default: "{{now}}"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"

      - label: Data de Atualizacao
        name: updatedDate
        widget: datetime
        required: false
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"

      - label: Descricao
        name: description
        widget: text
        required: true

      - label: Imagem de Capa
        name: coverImage
        widget: image
        required: false

      - label: Autor
        name: author
        widget: string
        required: false

      - label: Tags
        name: tags
        widget: list
        required: false
        field:
          label: Tag
          name: tag
          widget: string

      - label: Corpo do texto
        name: body
        widget: markdown
        required: true
